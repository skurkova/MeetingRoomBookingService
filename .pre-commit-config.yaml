repos:
  # Стандартные хуки pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml          # Проверка синтаксиса YAML
      - id: check-toml          # Проверка синтаксиса TOML (pyproject.toml)
      - id: end-of-file-fixer   # Пустая строка в конце файла
      - id: trailing-whitespace # Удаление лишних пробелов
      - id: check-added-large-files  # Запрет коммита файлов >500 КБ

  # Сортировка импортов (совместима с Black)
  - repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Форматирование кода
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length", "88"]

  # Линтер кода (PEP 8 + поиск багов)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  # Статический анализ типов (опционально — можно отключить, если мешает)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]
        args: [--ignore-missing-imports]

  # Поиск секретов и паролей в коде
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .env|pyproject.toml|poetry.lock